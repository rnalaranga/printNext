server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: rr-secure-print
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          must-revalidate: true

app:
  spool:
    storage-dir: spool_data
  printer:
    simulation-mode: ${SIMULATION_MODE:false}
    connection-timeout-ms: 5000
  ad:
    enabled: true
    ldap-url: ${LDAP_URL:ldap://127.0.0.1:389}
    domain: ${AD_DOMAIN:qoa.local}
    base-dn: ${AD_BASE_DN:DC=qoa,DC=local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
