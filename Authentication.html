    function fnFromAddressOnChange() {

        var lsForm = document.frmAuth;
        var obj = lsForm.SELFROMADDRESSSETTING;
        var currentValue = obj.value;
        if(currentValue == "LDAPUserName")
         prevVal = "LDAPUserName";
        else
        {
            if((prevVal == "LDAPUserName" || prevVal == undefined) && currentValue == "MachineDefault"){
                 setValue("EMAILADDRSETFRMNAME","NonEdit");
            }
            else if((prevVal == "LDAPUserName" || prevVal == undefined) && currentValue == "UserName"){
                setValue("EMAILADDRSETFRMNAME","FromAddress");
            }
            else if((prevVal == "LDAPUserName" || prevVal == undefined) && currentValue == "LocalUserEmail"){
                setValue("EMAILADDRSETFRMNAME","LoginUser");
            }
			if(getValue('SELUSERAUTH') != "0" || lsForm.AUTHMETH.selectedIndex != 0)
				document.frmAuth.EMAILADDRSETFRMNAME.disabled = false;
            prevVal = "";
        }

        var frmNameDropDown = lsForm.EMAILADDRSETFRMNAME;
        if(obj.value != "LDAPUserName") {
            for (var i=0;i<frmNameDropDown.length;  i++) {
                if (frmNameDropDown.options[i].value=="SearchLDAP") {
                    frmNameDropDown.remove(i);
                }
            }
        }
        else{
             for (var i=0;i<frmNameDropDown.length;  i++) {                 
                 if (frmNameDropDown.options[i].value !="SearchLDAP" && i<= frmNameDropDown.length-2)
                     continue;

                         var targetlength = frmNameDropDown.length;
                         frmNameDropDown.options[targetlength] = optionName;
                         frmNameDropDown.selectedIndex = frmNameDropDown.length-1;
                     }else{
                         frmNameDropDown.selectedIndex = i;
                         break;
                     }
                     frmNameDropDown.disabled=true;
                 }catch(ex) {
                         alert('internal error : invalid data');

                 }
             }

            hideDivs("FRMADDRSETTING_USERNAME");

            showDivs("FRMADDRSETTING_LDAPDOMAINNAME");

            if( getValue("SELUSERAUTH") == 1 || getValue("AUTHMETH") != "None" ) {

                showDivs("EmailLDAPAuthentication_Buttons");

                showDivs("EmailLDAPAuthentication_Table");
                fixColumnWidth('EmailldapAuthTableHeader', 'EmailldapAuthTable');

                hideDivs("EmailLDAPAuthentication_Buttons");
